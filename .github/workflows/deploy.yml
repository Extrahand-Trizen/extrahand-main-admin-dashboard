name: Deploy static build to MinIO

on:
  push:
    branches: [main, Ajay1]

concurrency:
  group: deploy-minio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # MinIO upload — support both CI names and local script names
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT || secrets.MINIO_SERVER_URL }}
      MINIO_SERVER_URL: ${{ secrets.MINIO_SERVER_URL || secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY || secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER || secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY || secrets.MINIO_ROOT_PASSWORD }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD || secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET || secrets.MINIO_BUCKET_NAME || 'frontend-builds' }}
      MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME || secrets.MINIO_BUCKET || 'frontend-builds' }}
      MINIO_REGION_NAME: ${{ secrets.MINIO_REGION_NAME }}
      MINIO_BROWSER_REDIRECT_URL: ${{ secrets.MINIO_BROWSER_REDIRECT_URL }}
      APP_FOLDER: ${{ secrets.APP_FOLDER }}
      # Backend API URL baked into Next.js static export at build time.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Require API URL for build
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_API_URL:-}" ]; then
            echo "::error::Set repository Variable NEXT_PUBLIC_API_URL (Settings → Secrets and variables → Actions → Variables)."
            echo "Example: https://extrahand-main-admin-server.backend.extrahand.in"
            exit 1
          fi
          echo "API URL configured for build (value not printed)."

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify out/ folder
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          echo "out/ ready with $(find out -type f | wc -l) files"

      - name: Upload out/ to MinIO (latest)
        run: npm run upload:build
